name: SUNLIGHT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref: a newer push cancels the superseded run instead of
# letting stale or refused runs stack.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` block executes under `bash -eo pipefail` (that is what an
# explicit `shell: bash` means on GitHub). Without this, GitHub's default for
# an un-shelled step is `bash -e` WITHOUT pipefail, so `pytest | tee` returns
# tee's exit code and a failing test suite exits 0. Measured 2026-09-21: with
# the DOJ fixture missing, pytest exited 1, tee exited 0, the step saw 0.
defaults:
  run:
    shell: bash

jobs:
  suite:
    name: Suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the container's interpreter, 3.14 is the development
        # machine's. The determinism claim must hold on both, on an OS
        # that is not the development machine.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run suite (Docker tests excluded here, run in their own job)
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_docker_live.py

  container:
    name: Container tests (build + live API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Docker live tests
        # ubuntu-latest runners ship a working Docker daemon and the
        # compose plugin; the fixture builds the image itself.
        run: python -m pytest tests/test_docker_live.py -q

  determinism:
    name: Determinism proof (double run, byte-identical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: DOJ gate twice, tests must pass and digests must match
        # The in-suite DOJ gate is the CI proxy for the recall floor. The
        # live 42,835-contract corpus read remains the release ritual.
        #
        # Two files run: the threshold-constant tests and the blind
        # end-to-end test that drives the real scoring engine
        # (InstitutionalPipeline -> score_contract -> assign_tier) over
        # each DOJ case. Running both twice and comparing digests proves
        # run-to-run determinism of the engine on a machine that is not
        # the development machine.
        #
        # Fail-closed rules, in order:
        #   1. pytest's own exit code is checked explicitly and the step
        #      exits with it. `shell: bash` also sets pipefail, so the
        #      tee pipe can no longer mask a red run.
        #   2. The elapsed-time suffix (" in 0.12s") is stripped before
        #      hashing. Wall-clock text is not determinism evidence; it
        #      made the old comparison flap on both success and failure.
        #   3. Any digest mismatch after that is a real determinism break
        #      and exits 1.
        run: |
          set -o pipefail
          DOJ_TESTS="tests/test_doj_calibration.py tests/test_doj_blind_e2e.py"
          python -m pytest $DOJ_TESTS -q -p no:cacheprovider | tee run1.txt
          python -m pytest $DOJ_TESTS -q -p no:cacheprovider | tee run2.txt
          strip_time() { sed -E 's/ in [0-9]+\.[0-9]+s//' "$1"; }
          d1=$(strip_time run1.txt | shasum -a 256 | cut -d' ' -f1)
          d2=$(strip_time run2.txt | shasum -a 256 | cut -d' ' -f1)
          echo "run1: $d1"
          echo "run2: $d2"
          # pytest's summary is its last line: "N passed in 0.12s" on green,
          # "N passed, M failed" / "M errors" on red. Judge only that line.
          for r in run1.txt run2.txt; do
            summary=$(tail -1 "$r")
            echo "$r summary: $summary"
            echo "$summary" | grep -qE '^[0-9]+ passed' || { echo "GATE: $r did not report a passing suite"; exit 1; }
            # whole tokens only: "3 xfailed" is an expected failure, not a failure
            echo "$summary" | grep -qE '(^|, )[0-9]+ (failed|errors?)( |,|$)' && { echo "GATE: $r reported failures or errors"; exit 1; }
          done
          test "$d1" = "$d2" && echo "DETERMINISM: byte-identical (timing stripped)" || { echo "DETERMINISM: MISMATCH"; exit 1; }
