name: SUNLIGHT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref: a newer push cancels the superseded run instead of
# letting stale or refused runs stack.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the container's interpreter, 3.14 is the development
        # machine's. The determinism claim must hold on both, on an OS
        # that is not the development machine.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run suite (Docker tests excluded here, run in their own job)
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_docker_live.py

  container:
    name: Container tests (build + live API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Docker live tests
        # ubuntu-latest runners ship a working Docker daemon and the
        # compose plugin; the fixture builds the image itself.
        run: python -m pytest tests/test_docker_live.py -q

  determinism:
    name: Determinism proof (double run, byte-identical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: DOJ calibration twice, digests must match
        # The in-suite calibration is the CI proxy for the floor. The
        # live 42,835-contract corpus read remains the release ritual.
        # Running the calibration test file twice and comparing output
        # digests proves run-to-run determinism on a machine that is
        # not the development machine.
        run: |
          python -m pytest tests/test_doj_calibration.py -q | tee run1.txt
          python -m pytest tests/test_doj_calibration.py -q | tee run2.txt
          d1=$(shasum -a 256 run1.txt | cut -d' ' -f1)
          d2=$(shasum -a 256 run2.txt | cut -d' ' -f1)
          echo "run1: $d1"
          echo "run2: $d2"
          test "$d1" = "$d2" && echo "DETERMINISM: byte-identical" || exit 1
