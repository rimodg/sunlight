name: SUNLIGHT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref: a newer push cancels the superseded run instead of
# letting stale or refused runs stack.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the container's interpreter, 3.14 is the development
        # machine's. The determinism claim must hold on both, on an OS
        # that is not the development machine.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run suite (Docker tests excluded here, run in their own job)
        run: |
          python scripts/restore_reference_cases.py
          python -m pytest tests/ -q \
            --ignore=tests/test_docker_live.py

  container:
    name: Container tests (build + live API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Docker live tests
        # ubuntu-latest runners ship a working Docker daemon and the
        # compose plugin; the fixture builds the image itself.
        run: python -m pytest tests/test_docker_live.py -q

  determinism:
    name: Determinism (analysis artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Reference fixture checks and deterministic analysis artifacts
        run: |
          python scripts/restore_reference_cases.py
          python -m pytest tests/test_doj_calibration.py -q
          python scripts/determinism_snapshot.py --output /tmp/sunlight-run1.json
          python scripts/determinism_snapshot.py --output /tmp/sunlight-run2.json
          cmp /tmp/sunlight-run1.json /tmp/sunlight-run2.json
          sha256sum /tmp/sunlight-run1.json /tmp/sunlight-run2.json

  dashboard:
    name: Evidence workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sunlight-dashboard/package-lock.json
      - run: npm ci
        working-directory: sunlight-dashboard
      - run: npm run build -- --base=/watch/
        working-directory: sunlight-dashboard
