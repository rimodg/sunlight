version: 2
updates:
  # Python dependencies: weekly, capped at 5 open PRs so the queue
  # stays reviewable. Security updates override the schedule.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions: pin actions to SHAs not tags; Dependabot keeps
  # the SHAs current without manual tracking.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
