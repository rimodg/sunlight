[pytest]
# The suite lives in tests/. Nothing else in this repository contains tests.
#
# This is deliberately belt-and-braces. Until the institution-readiness pass, pytest
# swept the whole rootdir and picked up five files under code/ that did not belong
# there — three byte-identical duplicates of tests/ modules (92 tests running twice)
# and two analysis scripts whose test_* functions take positional arguments no fixture
# supplies. Collecting them also poisoned the run: the suite hung indefinitely at
# tests/test_alert_api.py::test_config_returns_200, an endpoint that answers 200 in
# 0.0s on its own.
#
# Those five files are now gone from code/ — the duplicates deleted, the scripts moved
# to scripts/ and renamed so they no longer look like tests. This setting keeps the
# boundary explicit so the same drift cannot recur silently.
testpaths = tests

# code/ holds source. data/ holds corpus and profile data — small in this checkout
# (~600 KB), but the full contract corpus it mirrors is ~76 GB and is supplied
# separately by the deployment. Neither holds tests, and walking
# either wastes collection time.
norecursedirs = code data .venv .git __pycache__ node_modules sunlight-dashboard
